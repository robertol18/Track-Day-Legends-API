# Server configuration for production
server.port=8080
server.servlet.context-path=/api

# H2 Database configuration (for production would be replaced with PostgreSQL, MySQL, etc.)
spring.datasource.url=jdbc:h2:mem:trackdaydb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# H2 Console configuration (disabled in production)
spring.h2.console.enabled=false

# Logging configuration for production
logging.level.root=WARN
logging.level.com.example.trackdaylegends=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate=ERROR
logging.file.name=logs/application.log
logging.file.max-size=50MB
logging.file.max-history=90
logging.file.total-size-cap=5GB

# Actuator configuration for Kubernetes health probes
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
