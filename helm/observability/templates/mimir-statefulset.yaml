{{- if .Values.mimir.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "observability.mimir.fullname" . }}
  labels:
    app.kubernetes.io/name: {{ include "observability.mimir.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  serviceName: {{ include "observability.mimir.fullname" . }}
  replicas: {{ .Values.mimir.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "observability.mimir.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "observability.mimir.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: mimir
          image: "{{ .Values.mimir.image.repository }}:{{ .Values.mimir.image.tag }}"
          imagePullPolicy: {{ .Values.mimir.image.pullPolicy }}
          args:
            - -target=all
            - -config.file=/etc/mimir/mimir.yaml
          ports:
            - name: http
              containerPort: {{ .Values.mimir.service.port }}
              protocol: TCP
            - name: grpc
              containerPort: {{ .Values.mimir.service.grpcPort }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            {{- toYaml .Values.mimir.resources | nindent 12 }}
          securityContext:
            readOnlyRootFilesystem: false
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: config
              mountPath: /etc/mimir
            - name: data
              mountPath: /data
      volumes:
        - name: config
          configMap:
            name: {{ include "observability.mimir.fullname" . }}-config
  {{- if .Values.mimir.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          {{- toYaml .Values.mimir.persistence.accessModes | nindent 10 }}
        resources:
          requests:
            storage: {{ .Values.mimir.persistence.size }}
        {{- if .Values.mimir.persistence.storageClassName }}
        storageClassName: {{ .Values.mimir.persistence.storageClassName | quote }}
        {{- end }}
  {{- else }}
  volumeClaimTemplates: []
  {{- end }}
{{- end }}
