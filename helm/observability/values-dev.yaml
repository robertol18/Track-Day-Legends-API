targetApp:
  serviceName: track-day-legends
  servicePort: 80
  metricsPath: /actuator/prometheus

grafana:
  adminPassword: admin-dev
  persistence:
    size: 5Gi

prometheus:
  server:
    retention: 7d
    persistentVolume:
      size: 10Gi

loki:
  singleBinary:
    persistence:
      size: 10Gi
  chunksCache:
    # Default allocatedMemory (8192Mi) requests ~9.8Gi, more than this dev node has.
    allocatedMemory: 512
  resultsCache:
    allocatedMemory: 256

tempo:
  persistence:
    size: 5Gi

mimir:
  persistence:
    size: 10Gi
