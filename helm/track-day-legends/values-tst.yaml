replicaCount: 3

image:
  tag: "1.0.0"
  pullPolicy: IfNotPresent

env:
  SPRING_PROFILES_ACTIVE: "tst"
  JAVA_TOOL_OPTIONS: "-XX:InitialRAMPercentage=50.0 -XX:MaxRAMPercentage=75.0 -javaagent:/otel/opentelemetry-javaagent.jar"
  OTEL_SERVICE_NAME: "track-day-legends-api"
  OTEL_RESOURCE_ATTRIBUTES: "service.namespace=track-day-legends,deployment.environment=tst"
  OTEL_TRACES_EXPORTER: "otlp"
  OTEL_METRICS_EXPORTER: "otlp"
  OTEL_LOGS_EXPORTER: "otlp"
  OTEL_EXPORTER_OTLP_PROTOCOL: "http/protobuf"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4318"

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/path: "/actuator/prometheus"
  prometheus.io/port: "8080"

observability:
  prometheus:
    scrapeEnabled: true
  otelAgent:
    enabled: true

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 1Gi

ingress:
  enabled: true
  className: nginx
  hosts:
    - host: toshiba
      paths:
        - path: /
          pathType: Prefix
  tls: []

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

# Reference an existing secret managed outside Git (External Secrets, Sealed Secrets, etc.).
secret:
  create: false
  existingSecret: track-day-legends-api-secrets
